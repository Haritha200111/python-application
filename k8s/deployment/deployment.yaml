
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-api
  namespace: python-app
  labels:
    app: python-api

spec:
  replicas: 3

  revisionHistoryLimit: 5
  minReadySeconds: 5
  progressDeadlineSeconds: 300

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: python-api

  template:
    metadata:
      labels:
        app: python-api

    spec:
      imagePullSecrets:
        - name: dockerhub-registry

      terminationGracePeriodSeconds: 30

      containers:
        - name: python-api
          image: __IMAGE__
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
